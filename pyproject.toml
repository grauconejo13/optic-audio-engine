[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "optic-audio-engine"
version = "0.1.0"
description = "A local-first Python toolkit for reproducible acoustic feature analysis."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary - license pending" }
keywords = ["audio", "signal-processing", "speech", "acoustic-features"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Multimedia :: Sound/Audio :: Analysis",
]
dependencies = [
  "numpy>=1.24,<3",
  "librosa>=0.10.2,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
